openapi: 3.1.0
info:
  title: FreshLens API
  version: 1.0.0
  description: |
    V1 contract for FreshLens (CS3203 · Group 21 · PID 5).

    - Base path for versioned resources: `/api/v1`
    - Auth: Supabase JWT Bearer on versioned routes except public tenant
      application submission; `GET /health` is also public
    - Tenant isolation: auth middleware derives trusted identity from the JWT, and
      the tenant DB transaction sets Postgres `app.tenant_id` on its own connection;
      never trust a client-supplied `tenant_id`
    - Async scan only: `POST /api/v1/scans` returns **202**; the two-tier CNN
      pipeline runs in Celery, never in the request handler

    See `docs/api/README.md` for human overview and out-of-scope notes.
servers:
  - url: http://localhost:8000
    description: Local Docker Compose / FastAPI (prototype)
tags:
  - name: Health
  - name: Auth
  - name: Scans
  - name: Alerts
  - name: Devices
  - name: Products
  - name: Batches
  - name: Sales
  - name: Admin
  - name: Tenant applications
  - name: Tenant workspace
security:
  - bearerAuth: []

paths:
  /health:
    get:
      tags: [Health]
      summary: Liveness probe
      security: []
      operationId: getHealth
      responses:
        "200":
          description: Service is up
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"

  /api/v1/auth/me:
    get:
      tags: [Auth]
      summary: Return the verified FreshLens identity context
      operationId: getCurrentUser
      security:
        - bearerAuth: []
      x-freshlens-roles: [vendor, tenant_admin, platform_admin]
      responses:
        "200":
          description: Trusted identity derived from the signed Supabase JWT
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CurrentUser"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /api/v1/auth/hooks/access-token:
    post:
      tags: [Auth]
      summary: Supabase custom access-token hook (server to server)
      description: |
        Called by Supabase Auth on every sign-in and token refresh, not by
        clients. Authenticated by a Standard Webhooks signature
        (`webhook-id`, `webhook-timestamp`, `webhook-signature`) using
        `SUPABASE_AUTH_HOOK_SECRET`, not a Bearer token. Resolves `app_role`
        and `tenant_id` from the application database and returns the claims
        Supabase signs into the access token; claims are stripped for
        unprovisioned accounts and inactive tenants.
      operationId: accessTokenHook
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [user_id, claims]
              properties:
                user_id:
                  $ref: "#/components/schemas/Uuid"
                claims:
                  type: object
                  additionalProperties: true
                authentication_method:
                  type: string
      responses:
        "200":
          description: Claims for Supabase to sign
          content:
            application/json:
              schema:
                type: object
                required: [claims]
                properties:
                  claims:
                    type: object
                    additionalProperties: true
        "400":
          description: Malformed payload or claims for a different user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: Missing, forged, or stale webhook signature
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "503":
          description: Hook secret is not configured
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /api/v1/scans:
    post:
      tags: [Scans]
      summary: Submit a produce scan (async)
      description: |
        Accepts one product photo plus vendor-confirmed quantity.
        Uploads image (e.g. R2), inserts a `pending` scan row, enqueues a Celery job,
        and returns **202** immediately. Clients poll `GET /api/v1/scans/{scan_id}`.
      operationId: createScan
      security:
        - bearerAuth: []
      x-freshlens-roles: [vendor, tenant_admin]
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: "#/components/schemas/CreateScanMultipart"
      responses:
        "202":
          description: Scan accepted; inference queued
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ScanAccepted"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "422":
          $ref: "#/components/responses/ValidationError"
    get:
      tags: [Scans]
      summary: List recent scans for the current tenant
      operationId: listScans
      security:
        - bearerAuth: []
      x-freshlens-roles: [vendor, tenant_admin]
      parameters:
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Offset"
      responses:
        "200":
          description: Tenant-scoped scan page
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ScanList"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /api/v1/scans/{scan_id}:
    get:
      tags: [Scans]
      summary: Get a scan by id
      description: |
        Returns the full scan resource. While status is `pending` or `processing`,
        classification fields may be null. For an accepted identity, a completed
        scan includes the Model 2 classification and freshness score. Rejected
        identities complete without a freshness grade.
      operationId: getScan
      security:
        - bearerAuth: []
      x-freshlens-roles: [vendor, tenant_admin]
      parameters:
        - $ref: "#/components/parameters/ScanId"
      responses:
        "200":
          description: Scan resource
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Scan"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/v1/alerts:
    get:
      tags: [Alerts]
      summary: List alerts for the current tenant
      description: |
        Returns tenant-scoped, actionable inventory alerts. Active alerts are
        returned by default; resolved history can be requested explicitly.
      operationId: listAlerts
      security:
        - bearerAuth: []
      x-freshlens-roles: [vendor, tenant_admin]
      parameters:
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Offset"
        - name: active_only
          in: query
          required: false
          schema: { type: boolean, default: true }
      responses:
        "200":
          description: Tenant-scoped alerts
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AlertList"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /api/v1/alerts/{alert_id}/read:
    patch:
      tags: [Alerts]
      summary: Mark one tenant alert as read
      operationId: markAlertRead
      security:
        - bearerAuth: []
      x-freshlens-roles: [vendor, tenant_admin]
      parameters:
        - name: alert_id
          in: path
          required: true
          schema: { $ref: "#/components/schemas/Uuid" }
      responses:
        "200":
          description: Updated tenant alert
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Alert"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/v1/alerts/{alert_id}/dismiss:
    patch:
      tags: [Alerts]
      summary: Dismiss one tenant alert from the active feed
      description: Marks the alert read and resolved. The row remains available in alert history.
      operationId: dismissAlert
      security:
        - bearerAuth: []
      x-freshlens-roles: [vendor, tenant_admin]
      parameters:
        - name: alert_id
          in: path
          required: true
          schema: { $ref: "#/components/schemas/Uuid" }
      responses:
        "200":
          description: Dismissed tenant alert
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Alert"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/v1/devices:
    post:
      tags: [Devices]
      summary: Register or refresh this device's push token
      description: |
        Called by the vendor app after sign-in (FR-V-001). Upserts on
        `(tenant_id, token)`; tenant and user come from the JWT, never the body.
        The worker sends best-effort Expo Push wake-ups to active tokens when a
        scan completes/fails or a spoilage alert is raised (FR-V-006, FR-S-013).
      operationId: registerDevice
      security:
        - bearerAuth: []
      x-freshlens-roles: [vendor, tenant_admin]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterDeviceRequest"
      responses:
        "200":
          description: Device token registered and active
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Device"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "422":
          $ref: "#/components/responses/ValidationError"

  /api/v1/products:
    get:
      tags: [Products]
      summary: List products in the shared catalogue
      operationId: listProducts
      security:
        - bearerAuth: []
      x-freshlens-roles: [vendor, tenant_admin]
      responses:
        "200":
          description: Products available to every active tenant
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProductList"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /api/v1/batches:
    get:
      tags: [Batches]
      summary: List active inventory batches for the current tenant
      operationId: listBatches
      security:
        - bearerAuth: []
      x-freshlens-roles: [vendor, tenant_admin]
      parameters:
        - name: product_id
          in: query
          required: false
          schema:
            $ref: "#/components/schemas/Uuid"
        - name: active_only
          in: query
          required: false
          schema:
            type: boolean
            default: true
      responses:
        "200":
          description: Tenant-scoped inventory batches
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BatchList"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "422":
          $ref: "#/components/responses/ValidationError"

  /api/v1/sales:
    post:
      tags: [Sales]
      summary: Record a confirmed sale and deduct stock
      description: |
        Commits all confirmed line items atomically through the shared sales
        service. The transaction fails if any deduction would make stock
        negative. Tenant identity comes from the vendor JWT; `source` records
        provenance only and never affects authorization. For the same tenant,
        replaying the same idempotency key with the same payload returns the
        original successful result without another deduction. Reusing the same
        key with a different payload returns 409.
      operationId: createSale
      security:
        - bearerAuth: []
      x-freshlens-roles: [vendor, tenant_admin]
      parameters:
        - name: Idempotency-Key
          in: header
          required: true
          schema:
            type: string
            minLength: 1
            maxLength: 255
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateSaleRequest"
      responses:
        "201":
          description: Sale recorded and stock deducted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Sale"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/ValidationError"

  /api/v1/sales/voice-draft:
    post:
      tags: [Sales]
      summary: Parse a transcript into a non-mutating sale draft
      description: |
        Returns an untrusted draft and never changes inventory. The vendor must
        resolve every product, select a batch for every item, and confirm the
        final sale through `POST /api/v1/sales`.
      operationId: createVoiceSaleDraft
      security:
        - bearerAuth: []
      x-freshlens-roles: [vendor, tenant_admin]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/VoiceSaleDraftRequest"
      responses:
        "200":
          description: Untrusted non-mutating sale draft
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VoiceSaleDraft"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "422":
          $ref: "#/components/responses/ValidationError"

  /api/v1/tenant-applications:
    post:
      tags: [Tenant applications]
      summary: Submit a tenant signup application
      operationId: submitTenantApplication
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TenantApplicationCreate"
      responses:
        "202":
          description: Application accepted for platform review
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TenantApplicationSubmitted"
        "422":
          $ref: "#/components/responses/ValidationError"

  /api/v1/admin/tenant-applications:
    get:
      tags: [Tenant applications]
      summary: List tenant signup applications
      operationId: listTenantApplications
      x-freshlens-roles: [platform_admin]
      parameters:
        - name: status
          in: query
          schema:
            $ref: "#/components/schemas/TenantApplicationStatus"
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Offset"
      responses:
        "200":
          description: Application review queue
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TenantApplicationList"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /api/v1/admin/tenant-applications/{application_id}/approve:
    post:
      tags: [Tenant applications]
      summary: Approve an application, create its tenant, and invite its owner
      operationId: approveTenantApplication
      x-freshlens-roles: [platform_admin]
      parameters:
        - name: application_id
          in: path
          required: true
          schema: { $ref: "#/components/schemas/Uuid" }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TenantApplicationReview"
      responses:
        "200":
          description: Approved application linked to its tenant and owner
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TenantApplication"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: Application is no longer pending or email already exists

  /api/v1/admin/tenant-applications/{application_id}/reject:
    post:
      tags: [Tenant applications]
      summary: Reject a pending tenant application
      operationId: rejectTenantApplication
      x-freshlens-roles: [platform_admin]
      parameters:
        - name: application_id
          in: path
          required: true
          schema: { $ref: "#/components/schemas/Uuid" }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TenantApplicationReview"
      responses:
        "200":
          description: Rejected application
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TenantApplication"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: Application is no longer pending

  /api/v1/tenant/overview:
    get:
      tags: [Tenant workspace]
      summary: Get the current tenant's operational overview
      operationId: getTenantOverview
      x-freshlens-roles: [tenant_admin]
      responses:
        "200":
          description: RLS-scoped tenant totals
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TenantOverview"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /api/v1/tenant/analytics:
    get:
      tags: [Tenant workspace]
      summary: Get aggregate scan analytics for the current tenant
      operationId: getTenantAnalytics
      x-freshlens-roles: [tenant_admin]
      parameters:
        - name: days
          in: query
          schema: { type: integer, minimum: 1, maximum: 90, default: 30 }
      responses:
        "200":
          description: Tenant-scoped daily and pipeline totals
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminAnalytics"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /api/v1/tenant/users:
    get:
      tags: [Tenant workspace]
      summary: List vendor users in the current tenant
      operationId: listCurrentTenantUsers
      x-freshlens-roles: [tenant_admin]
      responses:
        "200":
          description: Current tenant's vendor users
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TenantUserList"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
    post:
      tags: [Tenant workspace]
      summary: Invite a vendor into the current tenant
      operationId: createCurrentTenantUser
      x-freshlens-roles: [tenant_admin]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TenantUserCreate"
      responses:
        "201":
          description: Vendor account mapped and invitation sent
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TenantUserCreated"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          description: Email is already registered

  /api/v1/tenant/users/{user_id}/status:
    patch:
      tags: [Tenant workspace]
      summary: Allow or revoke one vendor in the current tenant
      operationId: updateCurrentTenantUserStatus
      x-freshlens-roles: [tenant_admin]
      parameters:
        - name: user_id
          in: path
          required: true
          schema: { $ref: "#/components/schemas/Uuid" }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AccessStatusUpdate"
      responses:
        "200":
          description: Updated vendor access status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TenantUser"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/v1/admin/tenants:
    post:
      tags: [Admin]
      summary: Create a tenant and email its tenant admin an invitation
      operationId: createTenant
      security:
        - bearerAuth: []
      x-freshlens-roles: [platform_admin]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TenantCreate"
      responses:
        "201":
          description: Tenant and owner mapping created; invitation sent
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TenantCreated"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          description: Vendor email is already registered
        "422":
          $ref: "#/components/responses/ValidationError"
    get:
      tags: [Admin]
      summary: List tenant profiles and privacy-safe aggregates
      description: Returns organization metadata and current-month aggregate activity. No individual scan or inventory rows are exposed.
      operationId: listTenants
      security:
        - bearerAuth: []
      x-freshlens-roles: [platform_admin]
      parameters:
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Offset"
        - name: search
          in: query
          schema: { type: string, maxLength: 100, default: "" }
          description: Case-insensitive organization or primary-contact search.
        - name: status
          in: query
          schema: { type: string, enum: [active, inactive] }
        - name: tenant_id
          in: query
          schema: { $ref: "#/components/schemas/Uuid" }
      responses:
        "200":
          description: Tenant list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TenantList"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /api/v1/admin/tenants/{tenant_id}/status:
    patch:
      tags: [Admin]
      summary: Allow or revoke access for every user in a tenant
      operationId: updateTenantStatus
      security:
        - bearerAuth: []
      x-freshlens-roles: [platform_admin]
      parameters:
        - name: tenant_id
          in: path
          required: true
          schema: { $ref: "#/components/schemas/Uuid" }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AccessStatusUpdate"
      responses:
        "200":
          description: Updated tenant access status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TenantStatusUpdateResult"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          description: Tenant not found
        "422":
          $ref: "#/components/responses/ValidationError"

  /api/v1/admin/tenants/{tenant_id}/users:
    get:
      tags: [Admin]
      summary: List vendor users in a tenant
      operationId: listTenantUsers
      security:
        - bearerAuth: []
      x-freshlens-roles: [platform_admin]
      parameters:
        - name: tenant_id
          in: path
          required: true
          schema: { $ref: "#/components/schemas/Uuid" }
      responses:
        "200":
          description: Tenant user list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TenantUserList"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          description: Tenant not found
    post:
      tags: [Admin]
      summary: Invite a new vendor user into an existing tenant
      operationId: createTenantUser
      security:
        - bearerAuth: []
      x-freshlens-roles: [platform_admin]
      parameters:
        - name: tenant_id
          in: path
          required: true
          schema: { $ref: "#/components/schemas/Uuid" }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TenantUserCreate"
      responses:
        "201":
          description: User mapped to the tenant and invitation sent
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TenantUserCreated"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          description: Tenant not found
        "409":
          description: Email is already registered
        "422":
          $ref: "#/components/responses/ValidationError"

  /api/v1/admin/tenants/{tenant_id}/users/{user_id}/status:
    patch:
      tags: [Admin]
      summary: Allow or revoke one tenant user's access
      operationId: updateTenantUserStatus
      security:
        - bearerAuth: []
      x-freshlens-roles: [platform_admin]
      parameters:
        - name: tenant_id
          in: path
          required: true
          schema: { $ref: "#/components/schemas/Uuid" }
        - name: user_id
          in: path
          required: true
          schema: { $ref: "#/components/schemas/Uuid" }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AccessStatusUpdate"
      responses:
        "200":
          description: Updated user access status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TenantUser"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          description: Tenant user not found
        "422":
          $ref: "#/components/responses/ValidationError"

  /api/v1/admin/products:
    get:
      tags: [Admin]
      summary: List shared product metadata
      description: Returns global product configuration metadata without batches, quantities, or inventory rows.
      operationId: listAdminProducts
      security:
        - bearerAuth: []
      x-freshlens-roles: [platform_admin]
      parameters:
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 100
        - $ref: "#/components/parameters/Offset"
        - name: search
          in: query
          schema: { type: string, maxLength: 100, default: "" }
          description: Case-insensitive product name search.
        - name: tenant_id
          in: query
          schema: { $ref: "#/components/schemas/Uuid" }
          description: Scope monthly scan counts to one tenant; catalogue rows remain global.
        - name: product_id
          in: query
          schema: { $ref: "#/components/schemas/Uuid" }
      responses:
        "200":
          description: Shared product metadata
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminProductList"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /api/v1/admin/shelf-life-rules:
    get:
      tags: [Admin]
      summary: List shared product-category shelf-life rules
      operationId: listShelfLifeRules
      security:
        - bearerAuth: []
      x-freshlens-roles: [platform_admin]
      responses:
        "200":
          description: The four supported product categories and their configured durations
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/CategoryShelfLife"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /api/v1/admin/shelf-life-rules/{category}:
    put:
      tags: [Admin]
      summary: Set one category rule for every retailer
      description: The two stage durations update the matching global product. Their sum supplies the existing aging-alert shelf life; the configured stages do not override the CNN classification.
      operationId: updateShelfLifeRule
      security:
        - bearerAuth: []
      x-freshlens-roles: [platform_admin]
      parameters:
        - name: category
          in: path
          required: true
          schema:
            type: string
            enum: [banana, cucumber, eggplant, tomato]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CategoryShelfLifeUpdate"
      responses:
        "200":
          description: Updated category rule
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CategoryShelfLife"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "422":
          $ref: "#/components/responses/ValidationError"

  /api/v1/admin/alerts:
    get:
      tags: [Admin]
      summary: List tenant alert signals
      description: Returns alert signals and product context without batch identifiers.
      operationId: listAdminAlerts
      security:
        - bearerAuth: []
      x-freshlens-roles: [platform_admin]
      parameters:
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 100
        - $ref: "#/components/parameters/Offset"
        - name: search
          in: query
          schema: { type: string, maxLength: 100, default: "" }
          description: Case-insensitive alert message, tenant, or product search.
        - name: alert_type
          in: query
          schema: { $ref: "#/components/schemas/AlertType" }
        - name: severity
          in: query
          schema: { $ref: "#/components/schemas/AlertSeverity" }
      responses:
        "200":
          description: Tenant alert signals
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminAlertList"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /api/v1/admin/overview:
    get:
      tags: [Admin]
      summary: Get privacy-safe platform overview totals
      operationId: getAdminOverview
      security:
        - bearerAuth: []
      x-freshlens-roles: [platform_admin]
      responses:
        "200":
          description: Aggregate tenant, product, alert, and current-month classification totals
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminOverview"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /api/v1/admin/analytics:
    get:
      tags: [Admin]
      summary: Get aggregate scan analytics
      description: Returns daily classification totals and pipeline-status counts without individual scan records.
      operationId: getAdminAnalytics
      security:
        - bearerAuth: []
      x-freshlens-roles: [platform_admin]
      parameters:
        - name: days
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 90
            default: 90
        - name: tenant_id
          in: query
          required: false
          schema:
            oneOf:
              - $ref: "#/components/schemas/Uuid"
              - type: "null"
      responses:
        "200":
          description: Aggregate scan analytics
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminAnalytics"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Supabase Auth access token (JWT).

  parameters:
    ScanId:
      name: scan_id
      in: path
      required: true
      schema:
        $ref: "#/components/schemas/Uuid"
    Limit:
      name: limit
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
    Offset:
      name: offset
      in: query
      required: false
      schema:
        type: integer
        minimum: 0
        default: 0

  responses:
    Unauthorized:
      description: Missing or invalid JWT
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Forbidden:
      description: Authenticated but wrong role or tenant
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Conflict:
      description: Sale conflicts with current stock or idempotency state
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    NotFound:
      description: Resource not found in this tenant
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    ValidationError:
      description: Request validation failed
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"

  schemas:
    Uuid:
      type: string
      format: uuid

    Role:
      type: string
      enum: [vendor, tenant_admin, platform_admin]

    TenantApplicationStatus:
      type: string
      enum: [pending, approved, rejected]

    TenantApplicationCreate:
      type: object
      required: [organization_name, applicant_name, applicant_email]
      additionalProperties: false
      properties:
        organization_name: { type: string, minLength: 2, maxLength: 120 }
        applicant_name: { type: string, minLength: 2, maxLength: 120 }
        applicant_email: { type: string, format: email, maxLength: 254 }
        phone:
          type: [string, "null"]
          minLength: 5
          maxLength: 40

    TenantApplicationSubmitted:
      type: object
      required: [id, status, message]
      additionalProperties: false
      properties:
        id: { $ref: "#/components/schemas/Uuid" }
        status: { const: pending }
        message: { type: string }

    TenantApplicationReview:
      type: object
      additionalProperties: false
      properties:
        note:
          type: [string, "null"]
          maxLength: 1000

    TenantApplication:
      type: object
      additionalProperties: false
      required: [id, organization_name, applicant_name, applicant_email, phone, status, review_note, reviewed_by, approved_tenant_id, approved_user_id, submitted_at, reviewed_at, updated_at]
      properties:
        id: { $ref: "#/components/schemas/Uuid" }
        organization_name: { type: string }
        applicant_name: { type: string }
        applicant_email: { type: string, format: email }
        phone: { type: [string, "null"] }
        status: { $ref: "#/components/schemas/TenantApplicationStatus" }
        review_note: { type: [string, "null"] }
        reviewed_by:
          oneOf:
            - $ref: "#/components/schemas/Uuid"
            - type: "null"
        approved_tenant_id:
          oneOf:
            - $ref: "#/components/schemas/Uuid"
            - type: "null"
        approved_user_id:
          oneOf:
            - $ref: "#/components/schemas/Uuid"
            - type: "null"
        submitted_at: { type: string, format: date-time }
        reviewed_at: { type: [string, "null"], format: date-time }
        updated_at: { type: string, format: date-time }

    TenantApplicationList:
      type: object
      required: [items, total, limit, offset]
      additionalProperties: false
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/TenantApplication" }
        total: { type: integer, minimum: 0 }
        limit: { type: integer, minimum: 1 }
        offset: { type: integer, minimum: 0 }

    Classification:
      type: string
      enum: [fresh, medium, spoiled]
      description: FL-2TC Tier-2 freshness label.

    ScanStatus:
      type: string
      enum: [pending, processing, completed, failed]

    AlertSeverity:
      type: string
      enum: [info, warning, critical]

    AlertType:
      type: string
      enum: [spoilage, low_stock, aging, other]

    HealthResponse:
      type: object
      required: [status]
      additionalProperties: false
      properties:
        status:
          type: string
          enum: [ok]

    CurrentUser:
      type: object
      required: [user_id, role, tenant_id, email]
      additionalProperties: false
      properties:
        user_id:
          $ref: "#/components/schemas/Uuid"
        role:
          $ref: "#/components/schemas/Role"
        tenant_id:
          oneOf:
            - $ref: "#/components/schemas/Uuid"
            - type: "null"
        email:
          oneOf:
            - type: string
              format: email
            - type: "null"

    Error:
      type: object
      required: [detail]
      additionalProperties: false
      properties:
        detail:
          description: FastAPI-compatible error payload (string or structured object).
          oneOf:
            - type: string
            - type: object
              additionalProperties: true

    ProductSummary:
      type: object
      required: [id, name, low_stock_threshold]
      additionalProperties: false
      properties:
        id:
          $ref: "#/components/schemas/Uuid"
        name:
          type: string
          minLength: 1
        low_stock_threshold:
          type: integer
          minimum: 0

    ProductList:
      type: object
      required: [items]
      additionalProperties: false
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/ProductSummary"

    BatchSummary:
      type: object
      required: [id, product_id, intake_date, quantity_remaining]
      additionalProperties: false
      properties:
        id:
          $ref: "#/components/schemas/Uuid"
        product_id:
          $ref: "#/components/schemas/Uuid"
        intake_date:
          type: string
          format: date-time
        quantity_remaining:
          type: integer
          minimum: 0

    BatchList:
      type: object
      required: [items]
      additionalProperties: false
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/BatchSummary"

    SaleItemInput:
      type: object
      required: [product_id, batch_id, quantity_sold]
      additionalProperties: false
      properties:
        product_id:
          $ref: "#/components/schemas/Uuid"
        batch_id:
          $ref: "#/components/schemas/Uuid"
        quantity_sold:
          type: integer
          minimum: 1

    CreateSaleRequest:
      type: object
      required: [source, items]
      additionalProperties: false
      properties:
        source:
          type: string
          enum: [manual, voice]
          description: Provenance metadata only; never used for tenant authorization.
        items:
          type: array
          minItems: 1
          items:
            $ref: "#/components/schemas/SaleItemInput"

    SaleItem:
      type: object
      required:
        - id
        - product_id
        - batch_id
        - quantity_sold
        - quantity_remaining
      additionalProperties: false
      properties:
        id:
          $ref: "#/components/schemas/Uuid"
        product_id:
          $ref: "#/components/schemas/Uuid"
        batch_id:
          $ref: "#/components/schemas/Uuid"
        quantity_sold:
          type: integer
          minimum: 1
        quantity_remaining:
          type: integer
          minimum: 0

    Sale:
      type: object
      required: [id, source, items, created_at]
      additionalProperties: false
      properties:
        id:
          $ref: "#/components/schemas/Uuid"
        source:
          type: string
          enum: [manual, voice]
        items:
          type: array
          items:
            $ref: "#/components/schemas/SaleItem"
        created_at:
          type: string
          format: date-time

    VoiceSaleDraftRequest:
      type: object
      required: [transcript]
      additionalProperties: false
      properties:
        transcript:
          type: string
          minLength: 1
          maxLength: 2000

    VoiceSaleDraftItem:
      type: object
      required: [spoken_product, quantity_sold]
      additionalProperties: false
      properties:
        spoken_product:
          type: string
          minLength: 1
        quantity_sold:
          type: integer
          minimum: 1
        matched_product_id:
          oneOf:
            - $ref: "#/components/schemas/Uuid"
            - type: "null"
        confidence:
          type: number
          minimum: 0
          maximum: 1
        ambiguity:
          oneOf:
            - type: string
            - type: "null"

    VoiceSaleDraft:
      type: object
      required: [items, requires_confirmation, warnings]
      additionalProperties: false
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/VoiceSaleDraftItem"
        requires_confirmation:
          type: boolean
          const: true
        warnings:
          type: array
          items:
            type: string

    CreateScanMultipart:
      type: object
      required: [image, quantity]
      additionalProperties: false
      properties:
        image:
          type: string
          format: binary
          description: Single produce photo (V1 = one product per photo).
        quantity:
          type: integer
          minimum: 1
          description: Vendor-confirmed quantity at scan time.
        product_id:
          $ref: "#/components/schemas/Uuid"
        batch_id:
          $ref: "#/components/schemas/Uuid"

    ScanAccepted:
      type: object
      required: [id, status, created_at]
      additionalProperties: false
      properties:
        id:
          $ref: "#/components/schemas/Uuid"
        status:
          $ref: "#/components/schemas/ScanStatus"
          description: Typically `pending` at acceptance time.
        created_at:
          type: string
          format: date-time

    Scan:
      type: object
      required:
        - id
        - tenant_id
        - status
        - image_path
        - quantity
        - created_at
        - updated_at
      additionalProperties: false
      properties:
        id:
          $ref: "#/components/schemas/Uuid"
        tenant_id:
          $ref: "#/components/schemas/Uuid"
          description: Echo of tenant from JWT / RLS context (not client-authored).
        status:
          $ref: "#/components/schemas/ScanStatus"
        image_path:
          type: string
          description: Object storage key or URL path for the uploaded image.
        quantity:
          type: integer
          minimum: 1
        classification:
          oneOf:
            - $ref: "#/components/schemas/Classification"
            - type: "null"
        freshness_score:
          oneOf:
            - type: number
              format: float
              minimum: 0
              maximum: 1
            - type: "null"
          description: Model confidence or score; null until completed.
        model_version:
          oneOf:
            - type: string
            - type: "null"
          description: Combined identity and freshness pipeline version when both models run.
        identity_label:
          oneOf:
            - type: string
              enum: [Banana, Cucumber, Eggplant, Tomato]
            - type: "null"
          description: Tier-1 catalogue-compatible label; null for unknown or rejected input.
        identity_score:
          oneOf:
            - type: number
              format: float
              minimum: 0
              maximum: 1
            - type: "null"
          description: Tier-1 identity confidence; distinct from freshness_score.
        identity_model_version:
          oneOf:
            - type: string
            - type: "null"
        product_id:
          oneOf:
            - $ref: "#/components/schemas/Uuid"
            - type: "null"
        event_key:
          type: [string, "null"]
        product_name:
          type: [string, "null"]
        quantity_received:
          type: [integer, "null"]
          minimum: 0
        quantity_remaining:
          type: [integer, "null"]
          minimum: 0
        transition_at:
          type: [string, "null"]
          format: date-time
        read_at:
          type: [string, "null"]
          format: date-time
        resolved_at:
          type: [string, "null"]
          format: date-time
        batch_id:
          oneOf:
            - $ref: "#/components/schemas/Uuid"
            - type: "null"
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    ScanList:
      type: object
      required: [items, total, limit, offset]
      additionalProperties: false
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Scan"
        total:
          type: integer
          minimum: 0
        limit:
          type: integer
          minimum: 1
        offset:
          type: integer
          minimum: 0

    Alert:
      type: object
      required: [id, type, message, severity, created_at]
      additionalProperties: false
      properties:
        id:
          $ref: "#/components/schemas/Uuid"
        type:
          $ref: "#/components/schemas/AlertType"
        message:
          type: string
        severity:
          $ref: "#/components/schemas/AlertSeverity"
        created_at:
          type: string
          format: date-time
        batch_id:
          oneOf:
            - $ref: "#/components/schemas/Uuid"
            - type: "null"
        product_id:
          oneOf:
            - $ref: "#/components/schemas/Uuid"
            - type: "null"
        event_key:
          type: [string, "null"]
        product_name:
          type: [string, "null"]
        quantity_received:
          type: [integer, "null"]
        quantity_remaining:
          type: [integer, "null"]
        transition_at:
          type: [string, "null"]
          format: date-time
        read_at:
          type: [string, "null"]
          format: date-time
        resolved_at:
          type: [string, "null"]
          format: date-time

    RegisterDeviceRequest:
      type: object
      required: [token, platform]
      additionalProperties: false
      properties:
        token:
          type: string
          minLength: 1
          maxLength: 512
          description: Expo push token (e.g. `ExponentPushToken[...]`)
        platform:
          type: string
          enum: [ios, android]

    Device:
      type: object
      required: [id, platform, active, updated_at]
      additionalProperties: false
      properties:
        id:
          type: string
          format: uuid
        platform:
          type: string
          enum: [ios, android]
        active:
          type: boolean
        updated_at:
          type: string
          format: date-time

    AlertList:
      type: object
      required: [items, total, limit, offset]
      additionalProperties: false
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Alert"
        total:
          type: integer
          minimum: 0
        limit:
          type: integer
          minimum: 1
        offset:
          type: integer
          minimum: 0

    Tenant:
      type: object
      required: [id, name, status, created_at, member_count, catalogue_coverage, scans_this_month, fresh_scans_this_month, medium_scans_this_month, spoiled_scans_this_month, active_alerts]
      additionalProperties: false
      properties:
        id:
          $ref: "#/components/schemas/Uuid"
        name:
          type: string
        status:
          type: string
          enum: [active, inactive]
        created_at:
          type: string
          format: date-time
        updated_at:
          oneOf:
            - type: string
              format: date-time
            - type: "null"
        last_active_at:
          oneOf:
            - type: string
              format: date-time
            - type: "null"
        primary_contact_name:
          oneOf:
            - type: string
            - type: "null"
        primary_contact_email:
          oneOf:
            - type: string
            - type: "null"
        member_count:
          type: integer
          minimum: 0
        catalogue_coverage:
          type: integer
          minimum: 0
        scans_this_month:
          type: integer
          minimum: 0
        fresh_scans_this_month:
          type: integer
          minimum: 0
        medium_scans_this_month:
          type: integer
          minimum: 0
        spoiled_scans_this_month:
          type: integer
          minimum: 0
        active_alerts:
          type: integer
          minimum: 0

    TenantList:
      type: object
      required: [items, total, limit, offset]
      additionalProperties: false
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Tenant"
        total:
          type: integer
          minimum: 0
        limit:
          type: integer
          minimum: 1
        offset:
          type: integer
          minimum: 0

    TenantCreate:
      type: object
      required: [name, vendor_name, vendor_email]
      additionalProperties: false
      properties:
        name: { type: string, minLength: 1, maxLength: 120 }
        vendor_name: { type: string, minLength: 1, maxLength: 120 }
        vendor_email: { type: string, format: email, maxLength: 254 }

    TenantCreated:
      type: object
      required: [id, name, owner_user_id, vendor_email, invitation_sent]
      additionalProperties: false
      properties:
        id:
          $ref: "#/components/schemas/Uuid"
        name: { type: string }
        owner_user_id:
          $ref: "#/components/schemas/Uuid"
        vendor_email: { type: string, format: email }
        invitation_sent: { type: boolean, const: true }

    TenantUserCreate:
      type: object
      required: [display_name, email]
      additionalProperties: false
      properties:
        display_name: { type: string, minLength: 1, maxLength: 120 }
        email: { type: string, format: email, maxLength: 254 }

    TenantUser:
      type: object
      required: [id, tenant_id, display_name, email, status, created_at, updated_at]
      additionalProperties: false
      properties:
        id:
          $ref: "#/components/schemas/Uuid"
        tenant_id:
          $ref: "#/components/schemas/Uuid"
        display_name: { type: string }
        email: { type: string, format: email }
        status:
          type: string
          enum: [active, inactive]
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    TenantUserCreated:
      type: object
      required: [id, tenant_id, display_name, email, status, created_at, updated_at, invitation_sent]
      additionalProperties: false
      properties:
        id:
          $ref: "#/components/schemas/Uuid"
        tenant_id:
          $ref: "#/components/schemas/Uuid"
        display_name: { type: string }
        email: { type: string, format: email }
        status:
          type: string
          enum: [active, inactive]
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        invitation_sent: { type: boolean, const: true }

    TenantUserList:
      type: object
      required: [items, total]
      additionalProperties: false
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/TenantUser"
        total:
          type: integer
          minimum: 0

    AccessStatusUpdate:
      type: object
      required: [status]
      additionalProperties: false
      properties:
        status:
          type: string
          enum: [active, inactive]

    TenantStatusUpdateResult:
      type: object
