openapi: 3.1.0
info:
  title: FreshLens API
  version: 1.0.0
  description: |
    V1 contract for FreshLens (CS3203 · Group 21 · PID 5).

    - Base path for versioned resources: `/api/v1`
    - Auth: Supabase JWT Bearer on all routes except `GET /health`
    - Tenant isolation: API middleware sets Postgres `app.tenant_id` from the JWT;
      never trust a client-supplied `tenant_id` in the request body
    - Async scan only: `POST /api/v1/scans` returns **202**; CNN runs in Celery, never
      in the request handler (stub classifier acceptable for mid-eval)

    See `docs/api/README.md` for human overview and out-of-scope notes.
servers:
  - url: http://localhost:8000
    description: Local Docker Compose / FastAPI (prototype)
tags:
  - name: Health
  - name: Scans
  - name: Alerts
  - name: Products
  - name: Batches
  - name: Sales
  - name: Admin
security:
  - bearerAuth: []

paths:
  /health:
    get:
      tags: [Health]
      summary: Liveness probe
      security: []
      operationId: getHealth
      responses:
        "200":
          description: Service is up
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"

  /api/v1/scans:
    post:
      tags: [Scans]
      summary: Submit a produce scan (async)
      description: |
        Accepts one product photo plus vendor-confirmed quantity.
        Uploads image (e.g. R2), inserts a `pending` scan row, enqueues a Celery job,
        and returns **202** immediately. Clients poll `GET /api/v1/scans/{scan_id}`.
      operationId: createScan
      security:
        - bearerAuth: []
      x-freshlens-roles: [vendor]
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: "#/components/schemas/CreateScanMultipart"
      responses:
        "202":
          description: Scan accepted; inference queued
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ScanAccepted"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "422":
          $ref: "#/components/responses/ValidationError"
    get:
      tags: [Scans]
      summary: List recent scans for the current tenant
      operationId: listScans
      security:
        - bearerAuth: []
      x-freshlens-roles: [vendor]
      parameters:
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Offset"
      responses:
        "200":
          description: Tenant-scoped scan page
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ScanList"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /api/v1/scans/{scan_id}:
    get:
      tags: [Scans]
      summary: Get a scan by id
      description: |
        Returns the full scan resource. While status is `pending` or `processing`,
        classification fields may be null. When `completed`, classification and
        freshness_score are populated (stub values OK for mid-eval).
      operationId: getScan
      security:
        - bearerAuth: []
      x-freshlens-roles: [vendor]
      parameters:
        - $ref: "#/components/parameters/ScanId"
      responses:
        "200":
          description: Scan resource
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Scan"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/v1/alerts:
    get:
      tags: [Alerts]
      summary: List alerts for the current tenant
      description: |
        Minimal list for mobile/admin shells. May return an empty array until
        aging/low-stock alert rules (#19) land.
      operationId: listAlerts
      security:
        - bearerAuth: []
      x-freshlens-roles: [vendor]
      parameters:
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Offset"
      responses:
        "200":
          description: Tenant-scoped alerts
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AlertList"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /api/v1/products:
    get:
      tags: [Products]
      summary: List saleable products for the current tenant
      operationId: listProducts
      security:
        - bearerAuth: []
      x-freshlens-roles: [vendor]
      responses:
        "200":
          description: Tenant-scoped saleable products
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProductList"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /api/v1/batches:
    get:
      tags: [Batches]
      summary: List active inventory batches for the current tenant
      operationId: listBatches
      security:
        - bearerAuth: []
      x-freshlens-roles: [vendor]
      parameters:
        - name: product_id
          in: query
          required: false
          schema:
            $ref: "#/components/schemas/Uuid"
        - name: active_only
          in: query
          required: false
          schema:
            type: boolean
            default: true
      responses:
        "200":
          description: Tenant-scoped inventory batches
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BatchList"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "422":
          $ref: "#/components/responses/ValidationError"

  /api/v1/sales:
    post:
      tags: [Sales]
      summary: Record a confirmed sale and deduct stock
      description: |
        Commits all confirmed line items atomically through the shared sales
        service. The transaction fails if any deduction would make stock
        negative. Tenant identity comes from the vendor JWT; `source` records
        provenance only and never affects authorization. For the same tenant,
        replaying the same idempotency key with the same payload returns the
        original successful result without another deduction. Reusing the same
        key with a different payload returns 409.
      operationId: createSale
      security:
        - bearerAuth: []
      x-freshlens-roles: [vendor]
      parameters:
        - name: Idempotency-Key
          in: header
          required: true
          schema:
            type: string
            minLength: 1
            maxLength: 255
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateSaleRequest"
      responses:
        "201":
          description: Sale recorded and stock deducted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Sale"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/ValidationError"

  /api/v1/sales/voice-draft:
    post:
      tags: [Sales]
      summary: Parse a transcript into a non-mutating sale draft
      description: |
        Returns an untrusted draft and never changes inventory. The vendor must
        resolve every product, select a batch for every item, and confirm the
        final sale through `POST /api/v1/sales`.
      operationId: createVoiceSaleDraft
      security:
        - bearerAuth: []
      x-freshlens-roles: [vendor]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/VoiceSaleDraftRequest"
      responses:
        "200":
          description: Untrusted non-mutating sale draft
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VoiceSaleDraft"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "422":
          $ref: "#/components/responses/ValidationError"

  /api/v1/admin/tenants:
    get:
      tags: [Admin]
      summary: List tenants (platform admin placeholder)
      description: Placeholder for the Next.js admin scaffold (#10).
      operationId: listTenants
      security:
        - bearerAuth: []
      x-freshlens-roles: [platform_admin]
      parameters:
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Offset"
      responses:
        "200":
          description: Tenant list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TenantList"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Supabase Auth access token (JWT).

  parameters:
    ScanId:
      name: scan_id
      in: path
      required: true
      schema:
        $ref: "#/components/schemas/Uuid"
    Limit:
      name: limit
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
    Offset:
      name: offset
      in: query
      required: false
      schema:
        type: integer
        minimum: 0
        default: 0

  responses:
    Unauthorized:
      description: Missing or invalid JWT
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Forbidden:
      description: Authenticated but wrong role or tenant
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Conflict:
      description: Sale conflicts with current stock or idempotency state
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    NotFound:
      description: Resource not found in this tenant
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    ValidationError:
      description: Request validation failed
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"

  schemas:
    Uuid:
      type: string
      format: uuid

    Role:
      type: string
      enum: [vendor, platform_admin]

    Classification:
      type: string
      enum: [fresh, medium, spoiled]
      description: FL-2TC Tier-2 freshness label (stub OK for mid-eval).

    ScanStatus:
      type: string
      enum: [pending, processing, completed, failed]

    AlertSeverity:
      type: string
      enum: [info, warning, critical]

    AlertType:
      type: string
      enum: [spoilage, low_stock, aging, other]

    HealthResponse:
      type: object
      required: [status]
      additionalProperties: false
      properties:
        status:
          type: string
          enum: [ok]

    Error:
      type: object
      required: [detail]
      additionalProperties: false
      properties:
        detail:
          description: FastAPI-compatible error payload (string or structured object).
          oneOf:
            - type: string
            - type: object
              additionalProperties: true

    ProductSummary:
      type: object
      required: [id, name, low_stock_threshold]
      additionalProperties: false
      properties:
        id:
          $ref: "#/components/schemas/Uuid"
        name:
          type: string
          minLength: 1
        low_stock_threshold:
          type: integer
          minimum: 0

    ProductList:
      type: object
      required: [items]
      additionalProperties: false
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/ProductSummary"

    BatchSummary:
      type: object
      required: [id, product_id, intake_date, quantity_remaining]
      additionalProperties: false
      properties:
        id:
          $ref: "#/components/schemas/Uuid"
        product_id:
          $ref: "#/components/schemas/Uuid"
        intake_date:
          type: string
          format: date-time
        quantity_remaining:
          type: integer
          minimum: 0

    BatchList:
      type: object
      required: [items]
      additionalProperties: false
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/BatchSummary"

    SaleItemInput:
      type: object
      required: [product_id, batch_id, quantity_sold]
      additionalProperties: false
      properties:
        product_id:
          $ref: "#/components/schemas/Uuid"
        batch_id:
          $ref: "#/components/schemas/Uuid"
        quantity_sold:
          type: integer
          minimum: 1

    CreateSaleRequest:
      type: object
      required: [source, items]
      additionalProperties: false
      properties:
        source:
          type: string
          enum: [manual, voice]
          description: Provenance metadata only; never used for tenant authorization.
        items:
          type: array
          minItems: 1
          items:
            $ref: "#/components/schemas/SaleItemInput"

    SaleItem:
      type: object
      required:
        - id
        - product_id
        - batch_id
        - quantity_sold
        - quantity_remaining
      additionalProperties: false
      properties:
        id:
          $ref: "#/components/schemas/Uuid"
        product_id:
          $ref: "#/components/schemas/Uuid"
        batch_id:
          $ref: "#/components/schemas/Uuid"
        quantity_sold:
          type: integer
          minimum: 1
        quantity_remaining:
          type: integer
          minimum: 0

    Sale:
      type: object
      required: [id, source, items, created_at]
      additionalProperties: false
      properties:
        id:
          $ref: "#/components/schemas/Uuid"
        source:
          type: string
          enum: [manual, voice]
        items:
          type: array
          items:
            $ref: "#/components/schemas/SaleItem"
        created_at:
          type: string
          format: date-time

    VoiceSaleDraftRequest:
      type: object
      required: [transcript]
      additionalProperties: false
      properties:
        transcript:
          type: string
          minLength: 1
          maxLength: 2000

    VoiceSaleDraftItem:
      type: object
      required: [spoken_product, quantity_sold]
      additionalProperties: false
      properties:
        spoken_product:
          type: string
          minLength: 1
        quantity_sold:
          type: integer
          minimum: 1
        matched_product_id:
          oneOf:
            - $ref: "#/components/schemas/Uuid"
            - type: "null"
        confidence:
          type: number
          minimum: 0
          maximum: 1
        ambiguity:
          oneOf:
            - type: string
            - type: "null"

    VoiceSaleDraft:
      type: object
      required: [items, requires_confirmation, warnings]
      additionalProperties: false
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/VoiceSaleDraftItem"
        requires_confirmation:
          type: boolean
          const: true
        warnings:
          type: array
          items:
            type: string

    CreateScanMultipart:
      type: object
      required: [image, quantity]
      additionalProperties: false
      properties:
        image:
          type: string
          format: binary
          description: Single produce photo (V1 = one product per photo).
        quantity:
          type: integer
          minimum: 1
          description: Vendor-confirmed quantity at scan time.
        product_id:
          $ref: "#/components/schemas/Uuid"
        batch_id:
          $ref: "#/components/schemas/Uuid"

    ScanAccepted:
      type: object
      required: [id, status, created_at]
      additionalProperties: false
      properties:
        id:
          $ref: "#/components/schemas/Uuid"
        status:
          $ref: "#/components/schemas/ScanStatus"
          description: Typically `pending` at acceptance time.
        created_at:
          type: string
          format: date-time

    Scan:
      type: object
      required:
        - id
        - tenant_id
        - status
        - image_path
        - quantity
        - created_at
        - updated_at
      additionalProperties: false
      properties:
        id:
          $ref: "#/components/schemas/Uuid"
        tenant_id:
          $ref: "#/components/schemas/Uuid"
          description: Echo of tenant from JWT / RLS context (not client-authored).
        status:
          $ref: "#/components/schemas/ScanStatus"
        image_path:
          type: string
          description: Object storage key or URL path for the uploaded image.
        quantity:
          type: integer
          minimum: 1
        classification:
          oneOf:
            - $ref: "#/components/schemas/Classification"
            - type: "null"
        freshness_score:
          oneOf:
            - type: number
              format: float
              minimum: 0
              maximum: 1
            - type: "null"
          description: Model confidence or score; null until completed.
        model_version:
          oneOf:
            - type: string
            - type: "null"
          description: e.g. `stub-v0` for mid-eval; real FL-2TC version later.
        product_id:
          oneOf:
            - $ref: "#/components/schemas/Uuid"
            - type: "null"
        batch_id:
          oneOf:
            - $ref: "#/components/schemas/Uuid"
            - type: "null"
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    ScanList:
      type: object
      required: [items, total, limit, offset]
      additionalProperties: false
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Scan"
        total:
          type: integer
          minimum: 0
        limit:
          type: integer
          minimum: 1
        offset:
          type: integer
          minimum: 0

    Alert:
      type: object
      required: [id, type, message, severity, created_at]
      additionalProperties: false
      properties:
        id:
          $ref: "#/components/schemas/Uuid"
        type:
          $ref: "#/components/schemas/AlertType"
        message:
          type: string
        severity:
          $ref: "#/components/schemas/AlertSeverity"
        created_at:
          type: string
          format: date-time
        batch_id:
          oneOf:
            - $ref: "#/components/schemas/Uuid"
            - type: "null"
        product_id:
          oneOf:
            - $ref: "#/components/schemas/Uuid"
            - type: "null"

    AlertList:
      type: object
      required: [items, total, limit, offset]
      additionalProperties: false
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Alert"
        total:
          type: integer
          minimum: 0
        limit:
          type: integer
          minimum: 1
        offset:
          type: integer
          minimum: 0

    Tenant:
      type: object
      required: [id, name, created_at]
      additionalProperties: false
      properties:
        id:
          $ref: "#/components/schemas/Uuid"
        name:
          type: string
        created_at:
          type: string
          format: date-time

    TenantList:
      type: object
      required: [items, total, limit, offset]
      additionalProperties: false
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Tenant"
        total:
          type: integer
          minimum: 0
        limit:
          type: integer
          minimum: 1
        offset:
          type: integer
          minimum: 0
