name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  repo-check:
    name: Repository structure
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Verify monorepo layout
        run: |
          test -d apps/api
          test -d apps/web
          test -d apps/mobile
          test -d packages/ml
          test -d infra/db/migrations
          test -f infra/docker/docker-compose.yml
          test -f CONTRIBUTING.md
          echo "Monorepo scaffold OK"

  api-test:
    name: API tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: apps/api/requirements.txt
      - run: pip install -r requirements.txt
      - run: pytest

  web-check:
    name: Web admin checks
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build

  # ponytail: expand in #14 (ruff/lint, Docker build, RLS isolation)
