# Production TLS edge. Used by scripts/deploy-vps.sh when API_DOMAIN is set in
# the root .env. Caddy obtains and renews a Let's Encrypt certificate for
# API_DOMAIN (DNS A record -> this host, ports 80/443 open) and proxies to api.
services:
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    environment:
      API_DOMAIN: ${API_DOMAIN:?set API_DOMAIN in the root .env}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      api:
        condition: service_healthy

  api:
    restart: unless-stopped

  worker:
    restart: unless-stopped

  scheduler:
    restart: unless-stopped

volumes:
  caddy_data:
  caddy_config:
