# Local stack: Postgres + Redis + API. Worker stays commented until packages/ml lands (#32).
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: freshlens
      POSTGRES_PASSWORD: freshlens
      POSTGRES_DB: freshlens
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U freshlens"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build:
      context: ../../apps/api
    ports:
      - "8000:8000"
    env_file:
      - ../../.env.example
    environment:
      APP_ENV: development
      DATABASE_URL: postgresql://freshlens:freshlens@postgres:5432/freshlens
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/1
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')\""]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # worker:
  #   build: ../../packages/ml
  #   depends_on:
  #     redis:
  #       condition: service_healthy

volumes:
  postgres_data:
