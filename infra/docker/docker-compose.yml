# Local stack: Postgres + Redis + API + two-tier YOLO26-cls worker.
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: freshlens
      POSTGRES_PASSWORD: freshlens
      POSTGRES_DB: freshlens
    # Bind to loopback only — containers still reach Postgres on the Compose
    # network. Do not publish 5432 on 0.0.0.0 (demo VM had it open to the host).
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ../db/local/0000_supabase_compat.sql:/docker-entrypoint-initdb.d/0000_supabase_compat.sql:ro
      - ../db/migrations/0001_auth_tenancy.sql:/docker-entrypoint-initdb.d/0010_auth_tenancy.sql:ro
      - ../db/migrations/0002_business_tables.sql:/docker-entrypoint-initdb.d/0015_business_tables.sql:ro
      - ../db/migrations/0003_scan_identity.sql:/docker-entrypoint-initdb.d/0016_scan_identity.sql:ro
      - ../db/migrations/0004_category_shelf_life.sql:/docker-entrypoint-initdb.d/0017_category_shelf_life.sql:ro
      - ../db/migrations/0005_tenant_onboarding.sql:/docker-entrypoint-initdb.d/0018_tenant_onboarding.sql:ro
      - ../db/migrations/0006_http_access_token_hook.sql:/docker-entrypoint-initdb.d/0019_http_access_token_hook.sql:ro
      - ../db/migrations/0007_user_access_controls.sql:/docker-entrypoint-initdb.d/0019a_user_access_controls.sql:ro
      - ../db/migrations/0008_batch_lifecycle_alerts.sql:/docker-entrypoint-initdb.d/0019b_batch_lifecycle_alerts.sql:ro
      - ../db/migrations/0009_worker_tenant_access.sql:/docker-entrypoint-initdb.d/0019c_worker_tenant_access.sql:ro
      - ../db/migrations/0010_global_product_catalog.sql:/docker-entrypoint-initdb.d/0019d_global_product_catalog.sql:ro
      - ../db/migrations/0011_tenant_self_service.sql:/docker-entrypoint-initdb.d/0019e_tenant_self_service.sql:ro
      - ../db/local/0020_runtime_login.sql:/docker-entrypoint-initdb.d/0020_runtime_login.sql:ro
      - ../db/local/0030_demo_catalogue.sql:/docker-entrypoint-initdb.d/0030_demo_catalogue.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U freshlens"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build:
      context: ../../apps/api
    # Read the repository-root configuration directly. Relying only on Compose
    # interpolation can resolve SUPABASE_URL as empty because this file lives in
    # infra/docker rather than the repository root.
    env_file:
      - ../../.env
    ports:
      - "8000:8000"
    environment:
      APP_ENV: ${APP_ENV:-development}
      # COMPOSE_DATABASE_URL can point at a hosted restricted Supabase login.
      # DATABASE_URL in the root .env remains suitable for running the API on
      # the host, where the database hostname is localhost rather than postgres.
      DATABASE_URL: ${COMPOSE_DATABASE_URL:-postgresql://freshlens_api_local:freshlens_api_local@postgres:5432/freshlens}
      DATABASE_SSL_MODE: ${COMPOSE_DATABASE_SSL_MODE:-disable}
      SUPABASE_JWT_AUDIENCE: ${SUPABASE_JWT_AUDIENCE:-authenticated}
      SUPABASE_JWT_CLOCK_SKEW_SECONDS: ${SUPABASE_JWT_CLOCK_SKEW_SECONDS:-30}
      LOCAL_AUTH_SHADOW: ${LOCAL_AUTH_SHADOW:-true}
      TENANT_ADMIN_INVITE_REDIRECT_URL: ${TENANT_ADMIN_INVITE_REDIRECT_URL:-freshlens://set-password}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000,http://localhost:3001,http://localhost:3002}
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/1
      SCAN_STORAGE_DIR: /var/lib/freshlens/scans
    volumes:
      - scan_images:/var/lib/freshlens/scans
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')\""]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  worker:
    build:
      context: ../../packages/ml
    environment:
      DATABASE_URL: ${COMPOSE_DATABASE_URL:-postgresql://freshlens_api_local:freshlens_api_local@postgres:5432/freshlens}
      DATABASE_SSL_MODE: ${COMPOSE_DATABASE_SSL_MODE:-disable}
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/1
      SCAN_STORAGE_DIR: /var/lib/freshlens/scans
      CLASSIFIER: ${CLASSIFIER:-identity-v1}
      IDENTITY_WEIGHTS: ${IDENTITY_WEIGHTS:-/app/models/identity-v1.pt}
      IDENTITY_MODEL_VERSION: ${IDENTITY_MODEL_VERSION:-identity-yolo26n-cls-v1}
      IDENTITY_IMAGE_SIZE: ${IDENTITY_IMAGE_SIZE:-160}
      IDENTITY_MIN_CONFIDENCE: ${IDENTITY_MIN_CONFIDENCE:-0.75}
      FRESHNESS_WEIGHTS: ${FRESHNESS_WEIGHTS:-/app/models/freshness-v1.pt}
      FRESHNESS_MODEL_VERSION: ${FRESHNESS_MODEL_VERSION:-freshness-yolo26n-cls-v1}
      FRESHNESS_IMAGE_SIZE: ${FRESHNESS_IMAGE_SIZE:-224}
      FRESHNESS_MIN_CONFIDENCE: ${FRESHNESS_MIN_CONFIDENCE:-0.50}
      YOLO_CONFIG_DIR: /var/lib/freshlens/yolo
      PUSH_ENABLED: ${PUSH_ENABLED:-true}
      EXPO_ACCESS_TOKEN: ${EXPO_ACCESS_TOKEN:-}
      LIFECYCLE_WARNING_LEAD_HOURS: ${LIFECYCLE_WARNING_LEAD_HOURS:-24}
      LIFECYCLE_MIN_REMAINING_RATIO: ${LIFECYCLE_MIN_REMAINING_RATIO:-0.25}
    volumes:
      - scan_images:/var/lib/freshlens/scans
      - yolo_weights:/var/lib/freshlens/yolo
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  scheduler:
    build:
      context: ../../packages/ml
    command: ["celery", "-A", "worker.app", "beat", "--loglevel=info"]
    environment:
      DATABASE_URL: ${COMPOSE_DATABASE_URL:-postgresql://freshlens_api_local:freshlens_api_local@postgres:5432/freshlens}
      DATABASE_SSL_MODE: ${COMPOSE_DATABASE_SSL_MODE:-disable}
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/1
      LIFECYCLE_WARNING_LEAD_HOURS: ${LIFECYCLE_WARNING_LEAD_HOURS:-24}
      LIFECYCLE_MIN_REMAINING_RATIO: ${LIFECYCLE_MIN_REMAINING_RATIO:-0.25}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  postgres_data:
  scan_images:
  yolo_weights:
